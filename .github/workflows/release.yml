name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

# Conforms to Industrial-Algebra/Borsalino release.yml:
# tag push → verify tag matches Cargo.toml version → publish → GitHub
# release with the CHANGELOG section for this version.
jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "Publishing knopper v${CARGO_VERSION}"

      - name: Publish
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          # Extract section between this version header and the next one
          awk "/^## \[${VERSION}\]/,/^## \[/{ print }" CHANGELOG.md | head -n -1 > /tmp/release-notes.md
          echo "notes_path=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Knopper ${{ github.ref_name }}"
          body_path: ${{ steps.changelog.outputs.notes_path }}
          draft: false
          prerelease: false

  announce:
    name: Announce on industrialalgebra.com
    runs-on: ubuntu-latest
    needs: github-release
    uses: Industrial-Algebra/IA-home/.github/workflows/release-announce.yml@main
    with:
      product_name: "Knopper"
      version: ${{ github.ref_name }}
      release_notes: ${{ github.event.release.body }}
    secrets:
      ADMIN_API_KEY: ${{ secrets.IA_BLOG_API_KEY }}
