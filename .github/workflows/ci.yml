name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  # Core quality gate — runs on default features with no native deps.
  # This is the contract downstream consumes and the check that blocks
  # merges via branch protection.
  core:
    name: core (fmt-clippy-test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

  # Notcurses feature verification. The notcurses backend links against the
  # system notcurses library. libnotcurses-sys 3.11.0 requires notcurses
  # >= 3.0.11, but Ubuntu 24.04 ships only 3.0.7, so this job runs in an
  # Arch Linux container, which packages a current notcurses. The notcurses
  # crate's own vendored feature is not usable here: it ships pregenerated
  # Rust bindings only (no C source) and emits no link directives, which
  # leaves every ncplane_* symbol undefined at link time.
  notcurses:
    name: notcurses (feature build)
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install build dependencies
        # Arch mirrors rotate fast; a full sync+upgrade first avoids 404s
        # from stale package indexes.
        run: >
          pacman -Syu --noconfirm &&
          pacman -S --noconfirm --needed
          base-devel clang pkgconf notcurses rust git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo clippy --features notcurses -- -D warnings
        run: cargo clippy --all-targets --features notcurses -- -D warnings

      - name: cargo test --features notcurses
        run: cargo test --features notcurses
